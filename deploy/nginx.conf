# Put this file in an HTTPS-enabled nginx server configuration after setting
# server_name and certificate paths. The application listens on loopback:3001.
server {
    listen 80;
    server_name campus.example.edu;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name campus.example.edu;
    ssl_certificate /etc/letsencrypt/live/campus.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 51m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
