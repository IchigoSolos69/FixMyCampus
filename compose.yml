name: fixmycampus
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fixmycampus
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      APP_URL: http://localhost:3001
      DATABASE_URL: mysql://campus:campus@mysql:3306/fixmycampus
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APPROVED_EMAIL_DOMAINS: ${APPROVED_EMAIL_DOMAINS:-campus.test}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: FixMyCampus <noreply@campus.test>
      UPLOADS_DIR: /app/uploads
      STORAGE_DRIVER: local
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
volumes:
  mysql_data:
  uploads:
