name: Verify FixMyCampus
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fixmycampus_test
          MYSQL_USER: campus
          MYSQL_PASSWORD: campus
          MYSQL_ROOT_PASSWORD: ci-local-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-local-root-only --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://campus:campus@127.0.0.1:3306/fixmycampus_test
      TEST_DATABASE_URL: mysql://campus:campus@127.0.0.1:3306/fixmycampus_test
      APP_URL: http://localhost:5173
      APPROVED_EMAIL_DOMAINS: campus.test
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      E2E_BASE_URL: http://localhost:5173
      E2E_MAILPIT_URL: http://localhost:8025
      JWT_SECRET: ci-only-disposable-signing-key-do-not-use-this-in-production-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - name: Enable schema triggers in the disposable MySQL service
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          MYSQL_PWD: ci-local-root-only
        run: |
          docker exec --env MYSQL_PWD "$MYSQL_CONTAINER_ID" mysql --user=root \
            --execute='SET GLOBAL log_bin_trust_function_creators = 1;'
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: Browser scenarios
        shell: bash
        run: |
          mkdir -p .runtime
          npm run dev > .runtime/dev.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e "for(let i=0;i<60;i++){try{const r=await fetch('http://localhost:5173/api/v1/health');if(r.ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)"
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failure
          path: |
            playwright-report
            test-results
            .runtime/dev.log
          retention-days: 7
